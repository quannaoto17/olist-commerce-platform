services:
  postgres:
    image: postgres:16-alpine
    container_name: sla-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sla_attribution_db}
      POSTGRES_USER: ${POSTGRES_USER:-sla_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sla_secret_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sla_admin} -d ${POSTGRES_DB:-sla_attribution_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sla-spring-app
    restart: unless-stopped
    ports:
      - "${SERVER_PORT:-8080}:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-sla_attribution_db}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-sla_admin}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-sla_secret_password}
      LLM_API_URL: ${LLM_API_URL:-https://api.groq.com/openai/v1/chat/completions}
      LLM_API_KEY: ${LLM_API_KEY}
      LLM_MODEL: ${LLM_MODEL:-llama-3.3-70b-versatile}
    volumes:
      - ./data:/app/data:ro
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - full

volumes:
  postgres_data:
