spring:
  application:
    name: olist-commerce-platform
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  threads:
    virtual:
      enabled: true

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
          batch_size: 500
        order_inserts: true
        order_updates: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  batch:
    job:
      enabled: false
    jdbc:
      initialize-schema: always

app:
  cors:
    allowed-origins: ${FRONTEND_URL:http://localhost:5173}
  sla:
    olist-data-dir: ${OLIST_DATA_DIR:./data/raw}
    ai-review-max-stars: 2
  llm:
    api-url: ${LLM_API_URL:https://api.groq.com/openai/v1/chat/completions}
    api-key: ${LLM_API_KEY:demo-key}
    model: ${LLM_MODEL:llama-3.3-70b-versatile}
    temperature: 0.1
    timeout-seconds: 30

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
